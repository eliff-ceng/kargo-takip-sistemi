{% extends "layout.html" %}

{% block title %}
Yeni Kurye Ekle
{% endblock %}

{% block content %}

<div class="yonetici-dashboard">

    <!-- BAŞLIK -->
    <div class="yonetici-header">
        <div>
            <h1>Yeni Kurye Ekle</h1>
            <p>Sisteme yeni bir kurye ekleyebilirsiniz.</p>
        </div>
    </div>

    <!-- FORM -->
    <div class="yonetici-section">

        <div class="yonetici-section-header">
            <h2>Kurye Bilgileri</h2>
        </div>

        <form method="POST" action="{{ url_for('main.yonetici_kurye_ekle') }}">

            <div class="yonetici-filter-group">
                <label>Ad</label>
                <input type="text" name="ad" value="{{ request.form.get('ad','') }}" required>
            </div>

            <div class="yonetici-filter-group">
                <label>Soyad</label>
                <input type="text" name="soyad" value="{{ request.form.get('soyad','') }}" required>
            </div>

            <div class="yonetici-filter-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="kullanici_adi" value="{{ request.form.get('kullanici_adi','') }}" required>
            </div>

            <div class="yonetici-filter-group">
                <label>E-Posta</label>
                <input type="email" name="email" value="{{ request.form.get('email','') }}" required>
            </div>

            <div class="yonetici-filter-group">
                <label>Şifre</label>
                <input type="password" name="sifre" required>
            </div>

            <div class="yonetici-filter-group">
                <label>Telefon</label>
                <input type="text" name="telefon" value="{{ request.form.get('telefon','') }}" required>
            </div>

            <div class="yonetici-filter-group">
                <label>Bağlı Şube</label>

                <select name="sube_id" required>

                    <option value="">Şube Seçiniz</option>

                    {% for sube in subeler %}
                    <option value="{{ sube.id }}">
                        {{ sube.sube_ad }}
                    </option>
                    {% endfor %}

                </select>

            </div>

            <div class="yonetici-filter-buttons">

                <button type="submit" class="yonetici-menu-button">
                    Kurye Kaydet
                </button>

                <a href="{{ url_for('main.yonetici_kuryeler') }}" class="yonetici-menu-button">
                    Vazgeç
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
